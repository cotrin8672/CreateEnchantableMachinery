[versions]
kotlin = "2.4.20"
minecraft = "26.2"
fabricLoader = "0.19.5"
fabricApi = "0.161.0+26.2"
fabricKotlin = "1.14.1+kotlin.2.4.20"
loom = "1.17-SNAPSHOT"
createFly = "26.2-rc-2-6.0.9-1"
modPublisher = "2.2.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricLoader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricApi" }
fabric-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabricKotlin" }
createFly = { module = "maven.modrinth:create-fly", version.ref = "createFly" }

[plugins]
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
loom = { id = "net.fabricmc.fabric-loom", version.ref = "loom" }
modPublisher = { id = "com.hypherionmc.modutils.modpublisher", version.ref = "modPublisher" }
